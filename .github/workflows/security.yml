# .github/workflows/security.yml
name: security
on:
  push: { branches: [main, dev] }
  pull_request: { branches: [main, dev] }
  schedule: [{ cron: "23 4 * * 1" }]
permissions: { contents: read }
# L6-F7 (B24e): every action is pinned to a full commit SHA; the trailing comment is the release tag
# that SHA was resolved from (gh api git/ref + git/tags, 2026-09-02). Dependabot keeps both current.
concurrency: { group: "security-${{ github.ref }}", cancel-in-progress: true }
jobs:
  # `verify` and `auth-integration` are the required checks. Each is split: its tests run as four parts on four
  # machines at once, and a last job with the old name passes only when every part passed. One machine took 14 to 26
  # minutes for verify's tests and 17 to 42 for the integration list; every test still runs on every pull request.
  verify-static:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dialectical-engine } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with: { version: 11.20.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 26.8.2, cache: pnpm, cache-dependency-path: dialectical-engine/pnpm-lock.yaml }
      - run: node tools/source-map-hotfix.mjs install # pnpm install --frozen-lockfile
      - run: node tools/source-map-hotfix.mjs generate # pnpm run generate:contract
      - run: node tools/source-map-hotfix.mjs typecheck # pnpm run typecheck
      - run: node tools/source-map-hotfix.mjs audit # pnpm audit --audit-level=moderate
  verify-tests:
    runs-on: ubuntu-latest
    # Every part reports, also after another part has failed, so one run shows every failure.
    strategy: { fail-fast: false, matrix: { part: [1, 2, 3, 4] } }
    defaults: { run: { working-directory: dialectical-engine } }
    steps:
      # Full history: tests/unit/obs-l2-s04-zone.test.ts compares apps/api/src/index.ts against a
      # base commit with `git show`, which a depth-1 checkout cannot resolve (ZONE_BASE_UNRESOLVED).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with: { version: 11.20.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.8.2, cache: pnpm, cache-dependency-path: dialectical-engine/pnpm-lock.yaml }
      - run: node tools/source-map-hotfix.mjs install # pnpm install --frozen-lockfile
      - run: node tools/source-map-hotfix.mjs generate # pnpm run generate:contract
      # B31: the recorded known-red gate (tools/ci-known-red.mjs + tests/ci-known-red.txt).
      # It runs tests/unit, tests/architecture and tests/render (V, 2026-09-28) under vitest but
      # fails only on failures that are not on the recorded list; a listed test that passes three
      # runs in a row fails the gate until its entry is deleted (V-4).
      # Test files run side by side here (2026-11-01): 31 minutes one at a time, 10 to 16 minutes side by side.
      # CI_TEST_PART: this machine runs every fourth test file (tools/ci-known-red.mjs, partFiles). The number after
      # the slash must be the number of parts in the matrix above, or some files would run on no machine.
      # CI_CHANGED_SINCE: a pull request into dev that changes only legal texts or documents runs the test files that
      # can notice it (tools/ci-fast-path.mjs). It is empty on a push, so after the merge dev runs every test.
      - run: node tools/source-map-hotfix.mjs tests # pnpm run test:ci-gate
        env:
          CI_TEST_FILES_SIDE_BY_SIDE: "1"
          CI_TEST_PART: "${{ matrix.part }}/4"
          CI_CHANGED_SINCE: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.base.sha || '' }}
  # `always()`: a job that is skipped counts as passed for a required check, so this one must run and look at the
  # results itself. A part that failed, was cancelled or never started leaves it red.
  verify:
    needs: [verify-static, verify-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The static checks and all four test parts passed
        env:
          STATIC_CHECKS: ${{ needs.verify-static.result }}
          TEST_PARTS: ${{ needs.verify-tests.result }}
        run: |
          echo "verify-static: $STATIC_CHECKS, verify-tests: $TEST_PARTS"
          [ "$STATIC_CHECKS" = "success" ] && [ "$TEST_PARTS" = "success" ]
  # 2026-10-09 (review of PR #82): `verify` never ran tests/integration, so the only real proof of the sign-in and
  # account-security rules (server-side resend limit, 30-day absolute session cut-off, phone masking, recovery-email
  # lifecycle, reset/MFA-recovery non-enumeration, the staff boundary) ran nowhere. This job runs the curated list
  # tests/ci-integration-auth.txt through the same known-red gate, each file on its own embedded PostgreSQL
  # (@embedded-postgres/linux-x64; no Docker, network or secrets). Separate job: it runs in parallel with `verify`
  # (about four minutes of tests on the Mac). The ~34-minute registration/verification-mail suite is NOT here: it has its
  # own workflow, registration-integration.yml, which runs only when a path that can affect it changes, nightly and by hand.
  # The files run side by side here: each one has its own PostgreSQL on its own port, so they share nothing but the
  # machine. One at a time the 77 files took 17 to 42 minutes on a runner; the suites whose timing bounds need a quiet
  # machine are the registration ones, which keep their own workflow and still run one at a time.
  auth-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy: { fail-fast: false, matrix: { part: [1, 2, 3, 4] } }
    defaults: { run: { working-directory: dialectical-engine } }
    steps:
      # Full history: the text-only fast path compares with the pull request's base commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with: { version: 11.20.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.8.2, cache: pnpm, cache-dependency-path: dialectical-engine/pnpm-lock.yaml }
      - run: node tools/source-map-hotfix.mjs install # pnpm install --frozen-lockfile
      - run: node tools/source-map-hotfix.mjs generate # pnpm run generate:contract
      - run: node tools/source-map-hotfix.mjs integration # pnpm run test:ci-integration
        env:
          CI_TEST_FILES_SIDE_BY_SIDE: "1"
          CI_TEST_PART: "${{ matrix.part }}/4"
          CI_CHANGED_SINCE: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.base.sha || '' }}
  auth-integration:
    needs: [auth-integration-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All four parts of the integration list passed
        env:
          TEST_PARTS: ${{ needs.auth-integration-tests.result }}
        run: |
          echo "auth-integration-tests: $TEST_PARTS"
          [ "$TEST_PARTS" = "success" ]
  secrets:
    runs-on: ubuntu-latest
    env:
      # B7b: gitleaks runs as a pinned release binary; no organisation licence secret is needed.
      # GITLEAKS_SHA256 is the linux_x64 line of gitleaks_8.30.1_checksums.txt from the v8.30.1
      # release, cross-checked by hashing the downloaded asset on 2026-09-02.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: Install gitleaks (pinned release, sha256-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      # The BLOCKING scan covers the change under review: a pull request's commits (base..head) or the
      # commits of a push (before..after). The weekly schedule scans EVERY ref (--all) as the history
      # audit; it fails loudly on its own run and blocks no pull request. Reason (2026-09-23): with
      # --all on every run, 253 findings in other branches' histories (translation files where "zapis"
      # contains "api", recorded transcripts, test corpora) blocked a pull request that added none of
      # them; GitHub's own secret scanning (on since 2026-09-23) watches the whole history for real
      # provider tokens continuously. Findings are printed redacted: file, commit, rule — never the value.
      - name: Scan the change under review for secrets (every ref on the weekly schedule)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) LOG_OPTS="$PR_BASE_SHA..$HEAD_SHA" ;;
            push)
              if [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
                LOG_OPTS="$PUSH_BEFORE_SHA..$HEAD_SHA"
              else
                LOG_OPTS="--all"
              fi ;;
            *) LOG_OPTS="--all" ;;
          esac
          echo "gitleaks scope: $LOG_OPTS"
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --config .gitleaks.toml --log-opts="$LOG_OPTS" .
  codeql:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
