# .github/workflows/security.yml
name: security
on:
  push: { branches: [main, dev] }
  pull_request: { branches: [main, dev] }
  schedule: [{ cron: "23 4 * * 1" }]
permissions: { contents: read }
# L6-F7 (B24e): every action is pinned to a full commit SHA; the trailing comment is the release tag
# that SHA was resolved from (gh api git/ref + git/tags, 2026-09-02). Dependabot keeps both current.
concurrency: { group: "security-${{ github.ref }}", cancel-in-progress: true }
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dialectical-engine } }
    steps:
      # Full history: tests/unit/obs-l2-s04-zone.test.ts compares apps/api/src/index.ts against a
      # base commit with `git show`, which a depth-1 checkout cannot resolve (ZONE_BASE_UNRESOLVED).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with: { version: 11.20.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 26.8.2, cache: pnpm, cache-dependency-path: dialectical-engine/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate:contract
      - run: pnpm run typecheck
      # B31: the recorded known-red gate (tools/ci-known-red.mjs + tests/ci-known-red.txt).
      # It runs the same two directories under vitest but fails only on failures that are not
      # on the recorded list, and warns when a listed test starts passing.
      - run: pnpm run test:ci-gate
      - run: pnpm audit --audit-level=moderate
  secrets:
    runs-on: ubuntu-latest
    env:
      # B7b: gitleaks runs as a pinned release binary; no organisation licence secret is needed.
      # GITLEAKS_SHA256 is the linux_x64 line of gitleaks_8.30.1_checksums.txt from the v8.30.1
      # release, cross-checked by hashing the downloaded asset on 2026-09-02.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: Install gitleaks (pinned release, sha256-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      # The BLOCKING scan covers the change under review: a pull request's commits (base..head) or the
      # commits of a push (before..after). The weekly schedule scans EVERY ref (--all) as the history
      # audit; it fails loudly on its own run and blocks no pull request. Reason (2026-09-23): with
      # --all on every run, 253 findings in other branches' histories (translation files where "zapis"
      # contains "api", recorded transcripts, test corpora) blocked a pull request that added none of
      # them; GitHub's own secret scanning (on since 2026-09-23) watches the whole history for real
      # provider tokens continuously. Findings are printed redacted: file, commit, rule — never the value.
      - name: Scan the change under review for secrets (every ref on the weekly schedule)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) LOG_OPTS="$PR_BASE_SHA..$HEAD_SHA" ;;
            push)
              if [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
                LOG_OPTS="$PUSH_BEFORE_SHA..$HEAD_SHA"
              else
                LOG_OPTS="--all"
              fi ;;
            *) LOG_OPTS="--all" ;;
          esac
          echo "gitleaks scope: $LOG_OPTS"
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --config .gitleaks.toml --log-opts="$LOG_OPTS" .
  codeql:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
