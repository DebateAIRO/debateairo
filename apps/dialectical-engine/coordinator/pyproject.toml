[project]
name = "dialectical-engine-coordinator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "bcrypt>=4.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
# Repo-local temp/cache roots so the literal acceptance command
# (PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 ... -m pytest -p pytest_cov.plugin -p pytest_asyncio.plugin tests/ -q)
# is reproducible even when the OS default pytest temp root
# (e.g. %LOCALAPPDATA%\Temp\pytest-of-<user> on Windows) is not writable.
# addopts values are prepended to the CLI args, so an explicit --basetemp on
# the command line still wins (pytest/argparse last-match-wins); see
# hermes-ticket-3-report.md step 3c for the empirical proof.
addopts = "--basetemp=.tmp/pytest-basetemp"
cache_dir = ".tmp/pytest-cache"
