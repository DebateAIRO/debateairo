# config/models.yaml
# Which models debate in each tier.
# Edit, then restart the stack.
# CLIs: codex (OpenAI) · claude (Anthropic) · grok (xAI) · api: openai | zai

free:
  - api: openai
    model: gpt-5.6-luna
    base_url: https://api.openai.com/v1
    key: OPENAI_API_KEY
  - api: zai
    model: glm-5.3-flash
    base_url: https://api.z.ai/api/coding/paas/v4
    key: ZAI_API_KEY

premium:
  - cli: codex
    model: gpt-5.6-sol
  - cli: claude
    model: claude-opus-5
  - cli: grok
    model: grok-4.6-build

