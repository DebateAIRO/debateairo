            <div style=\"background:{{ tA.shell }}; border:1px solid {{ tA.hairStrong }}; border-radius:16px; padding:7px; box-shadow:{{ tA.shadow }};\">\n                <div style=\"position:relative; overflow:hidden; background:{{ tA.core }}; border:1px solid {{ tA.hair }}; border-radius:10px; padding:18px 19px 13px;\">\n                  <span style=\"position:absolute; top:0; left:19px; width:52px; height:4px; border-radius:0 0 5px 5px; background:{{ tA.ink }};\"><\u002Fspan>\n                  <div style=\"font-family:ui-monospace,Menlo,monospace; font-size:9.5px; font-weight:600; letter-spacing:.18em; color:{{ tA.mute }}; margin-bottom:9px;\">ROOT CLAIM<\u002Fdiv>\n                  <p style=\"margin:0; font-family:Fraunces,serif; font-weight:600; font-size:15.5px; line-height:1.45; text-wrap:pretty;\">{{ rootClaim }}<\u002Fp>\n                  <div style=\"display:flex; align-items:center; margin-top:11px; padding-top:9px; border-top:1px solid {{ tA.hair }}; font-size:11px; font-weight:600; color:{{ tA.mute }};\">\n                    <span>Hover a wedge to inspect · click to focus<\u002Fspan><span style=\"flex:1;\"><\u002Fspan><span style=\"cursor:pointer;\">Open in Split ▸<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n          <!-- synthesis rail -->\n          <div style=\"width:280px; flex:0 0 auto; border-left:1px solid {{ tA.hair }}; background:{{ tA.railBg }}; padding:18px 16px; display:flex; flex-direction:column; gap:12px;\">\n            <div style=\"display:flex; align-items:center; gap:8px;\"><span style=\"width:8px; height:8px; transform:rotate(45deg); background:{{ tA.gold }};\"><\u002Fspan><span style=\"font-family:Fraunces,serif; font-size:15px; font-weight:600;\">Synthesis<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:10.5px; color:{{ tA.mute }}; margin-top:-6px;\">The strongest case on each side, plus -radius:999px; background:linear-gradient(90deg, {{ tA.pro }} 0%, {{ tA.pro }} 46%, {{ tA.con }} 46%);\"><\u002Fspan>\n                <span style=\"font-size:9.5px; font-weight:700; color:{{ tA.con }};\">Con 54<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:10px; color:{{ tA.mute }};\">Scoring · 24 of 31 claims scored · DF-QuAD<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:12px; font-size:12px; color:#6E675C; max-width:640px;\">Terracotta light / Chamber dark from one token set. Card = shell + core double bezel; the small top tab and the connector both carry the stance color; gold is reserved for reasoning &amp; verdict.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:1100},&quot;recommendedMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;1a Recommended&quot;}}\">\nclass Component extends DCLogic {\n  state = { mode: null };\n  tree() {\n    const A_CLAUDE = 'Anthropic · Claude · claude-opus-5';\n    const A_GPT = 'OpenAI · GPT · gpt-5.6-sol';\n    const A_GEM = 'Google · Gemini · gemini-3-ultra';\n    const A_GROK = 'xAI · Grok · grok-4.5';\n    const A_QWEN = 'Qwen · local · qwen-3-coder';\n    return {\n      id: 'root', type: 'root',\n      claim: 'Should remote-first companies pay engineers the same salary regardless of where they live?',\n      kids: [{\n        id: 'r1', type: 'reasoning', title: 'Location-independent bands, transparently adjusted', base: 94, final: 94, review: 'AGREE', author: A_GPT, aKey: 'gpt', reviewer: A_CLAUDE, rKey: 'claude',\n        claim: 'Remote-first companies should generally use location-independent salary bands for engineers performing equivalent work, while allowing transparent adjustments for legally required costs, scarce skills, and role scope.',\n        kids: [{\n          id: 'p1', type: 'pro', title: 'One global rate for the work delivered', base: 95, final: 95, review: 'DISPUTE', author: A_CLAUDE, aKey: 'claude', reviewer: A_GPT, rKey: 'gpt',\n          claim: 'Remote-first companies should pay a single global rate for a given role and level, because compensation is owed for the work delivered rather than for the worker\\u2019s postal code: two engineers at the same level producing comparable value contribute equally to the firm\\u2019s output, so location-based pay cuts charge one of them for a private residential choice that does not diminish that contribution, and a uniform rate \\u2014 adjusted only for legally unavoidable employer costs and currency conversion \\u2014 yields a transparent, internally consistent, and manipulation-resistant pay structure.',\n          kids: [{\n            id: 'p1c1', type: 'con', title: 'Global rates anchor low', base: 72, final: 68, review: 'AGREE', author: A_GEM, aKey: 'gemini', reviewer: A_GPT, rKey: 'gpt',\n            claim: 'A single global rate anchors to the lowest defensible number: when payroll cannot flex by market, firms quietly lower the level everywhere or slow hiring in expensive markets.', kids: []\n          }, {\n            id: 'p1p1', type: 'pro', title: 'No relocation penalty', base: 66, final: 70, review: 'AGREE', author: A_QWEN, aKey: 'qwen', reviewer: A_CLAUDE, rKey: 'claude',\n            claim: 'Uniform bands remove relocation penalties, so internal mobility and caregiving moves stop costing engineers their compensation.', kids: []\n          }]\n        }, {\n          id: 'c1', type: 'con', title: 'Price pay to the local market', base: 85, final: 85, review: 'AGREE', author: A_CLAUDE, aKey: 'claude', reviewer: A_GPT, rKey: 'gpt',\n          claim: 'Remote-first companies should generally set en
