name: debateai-v3

services:
  postgres:
    image: postgres:${POSTGRES_MAJOR_VERSION:?generated from register.bootstrap.json by pnpm compose:env}@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_USER: debateai
      POSTGRES_PASSWORD: debateai-dev-only
      POSTGRES_DB: debateai
    volumes:
      # PostgreSQL 18 stores clusters beneath a major-version-specific
      # directory. Mount the parent so the official image can manage that
      # layout and future pg_upgrade --link operations stay inside one volume.
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init-hatchet.sql:/docker-entrypoint-initdb.d/init-hatchet.sql:ro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  hatchet-lite:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest@sha256:7198bda4d73021a9759d90c57f11f1dd2b32599b81f4c08a5a97ea4cf047c41a
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:7077:7077"
    environment:
      DATABASE_URL: postgresql://debateai:debateai-dev-only@postgres:5432/hatchet?sslmode=disable
      SERVER_MSGQUEUE_KIND: postgres
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "true"
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_INSECURE: "true"
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_GRPC_PORT: "7077"
      SERVER_URL: http://localhost:8888
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077

  vllm:
    image: vllm/vllm-openai:latest@sha256:ffb2d59b1c059a5bd8d781320c9f5189de8293693b7d95da54befddaa54abf52
    ports:
      - "127.0.0.1:8000:8000"
    command:
      - --model
      - ${VLLM_MODEL:?VLLM_MODEL must name a real provisioned model}

volumes:
  postgres-data:
