# Install as /etc/systemd/system/debateai-preview-api.service.d/50-lifecycle.conf
# Restart policy plus SOFT ordering. systemd cannot remove a Requires= from a drop-in, so the
# existing Requires=debateai-preview-capture.service (and any Requires= on Hatchet) must be
# taken out of the file that declares it; see README "Soften the API's hard dependencies".
# The release-specific ExecStartPre/ExecStart live in the generated
# zzzzzzzzzz-lifecycle-release.conf (prestart.mjs dropin --service api).
[Unit]
Wants=debateai-preview-postgresql.service debateai-preview-hatchet.service debateai-preview-hatchet-gateway.service
Wants=debateai-preview-capture.service debateai-preview-provider-budget.service debateai-preview-turnstile.service
After=debateai-preview-postgresql.service debateai-preview-hatchet.service debateai-preview-hatchet-gateway.service
After=debateai-preview-capture.service debateai-preview-provider-budget.service debateai-preview-turnstile.service
StartLimitIntervalSec=900
StartLimitBurst=4
OnFailure=debateai-preview-alert@%n.service

[Service]
Restart=on-failure
RestartSec=10
# Covers the root prestart (native verify, about 12 s; hard cap 150 s) before ExecStart.
TimeoutStartSec=300
