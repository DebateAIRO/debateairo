# Install as /etc/systemd/system/debateai-preview-postgresql.service.d/50-lifecycle.conf
# Restart the preview database after a crash; after 4 failed starts in 15 minutes, stop and email.
[Unit]
StartLimitIntervalSec=900
StartLimitBurst=4
OnFailure=debateai-preview-alert@%n.service

[Service]
Restart=on-failure
# systemd >= 254: without direct, OnFailure= runs after EVERY failed attempt, so a crash that
# heals itself would still email. direct = straight back to starting; OnFailure= only once the
# start limit gives up. Needs systemd >= 254 (README install step 0 checks the version).
RestartMode=direct
RestartSec=10
TimeoutStartSec=300
