# Install as /etc/systemd/system/debateai-preview-ui@.service.d/50-lifecycle.conf
# Side-by-side spec §10: one website instance per release, debateai-preview-ui@<label>.service (%i = the
# release label). The template itself (debateai-preview-ui@.service and its other drop-ins) is rendered
# from the live fixed unit by unit-templates.mjs render; this file replaces that unit's 50-lifecycle.conf.
# The release-specific ExecStartPre/ExecStart live in the instance's generated
# debateai-preview-ui@<label>.service.d/zzzzzzzzzz-lifecycle-release.conf (prestart.mjs dropin --service ui --label <label>).
[Unit]
# The website belongs to its own release's API instance, never another release's (side-by-side spec §6):
# starting it starts that API, and it stops whenever that API stops (prestart also checks BindsTo=).
# The API's own RestartMode=direct keeps the website up through an API crash that heals itself.
BindsTo=debateai-preview-api@%i.service
After=debateai-preview-api@%i.service
StartLimitIntervalSec=900
StartLimitBurst=4
OnFailure=debateai-preview-alert@%n.service

[Service]
Restart=on-failure
# systemd >= 254: without direct, OnFailure= runs after EVERY failed attempt, so a crash that
# heals itself would still email. direct = straight back to starting; OnFailure= only once the
# start limit gives up. Needs systemd >= 254 (README install step 0 checks the version).
RestartMode=direct
# 30 s between tries: room for PostgreSQL to finish starting after a reboot or its own restart.
RestartSec=30
TimeoutStartSec=300
# Side-by-side plan D: each release's website gets at most 1G, so two releases side by side fit the host.
MemoryMax=1G
