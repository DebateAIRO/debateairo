# Install as /etc/systemd/system/debateai-preview-api@.service.d/50-lifecycle.conf
# Side-by-side spec §10: one API instance per release, debateai-preview-api@<label>.service (%i = the
# release label). The template itself (debateai-preview-api@.service and its other drop-ins) is rendered
# from the live fixed unit by unit-templates.mjs render; this file replaces that unit's 50-lifecycle.conf.
# Restart policy plus SOFT ordering. systemd cannot remove a Requires= from a drop-in, so the
# existing Requires=debateai-preview-capture.service (and any Requires= on Hatchet) must be
# taken out of the file that declares it; see README "Soften the API's hard dependencies".
# The release-specific ExecStartPre/ExecStart live in the instance's generated
# debateai-preview-api@<label>.service.d/zzzzzzzzzz-lifecycle-release.conf (prestart.mjs dropin --service api --label <label>).
[Unit]
Wants=debateai-preview-postgresql.service debateai-preview-hatchet.service debateai-preview-hatchet-gateway.service
Wants=debateai-preview-capture.service debateai-preview-provider-budget.service debateai-preview-turnstile.service
# The Anthropic spending gate, like the DeepInfra one; a gate that is not installed yet is simply skipped.
Wants=debateai-preview-anthropic-budget.service
After=debateai-preview-postgresql.service debateai-preview-hatchet.service debateai-preview-hatchet-gateway.service
After=debateai-preview-capture.service debateai-preview-provider-budget.service debateai-preview-turnstile.service
After=debateai-preview-anthropic-budget.service
StartLimitIntervalSec=900
StartLimitBurst=4
OnFailure=debateai-preview-alert@%n.service

[Service]
Restart=on-failure
# systemd >= 254: without direct, OnFailure= runs after EVERY failed attempt, so a crash that
# heals itself would still email. direct = straight back to starting; OnFailure= only once the
# start limit gives up. Needs systemd >= 254 (README install step 0 checks the version).
# It also keeps the website up through such a restart: its BindsTo= on this instance only stops it
# when this instance reaches inactive or failed, which a direct restart skips.
RestartMode=direct
# 30 s between tries: room for PostgreSQL to finish starting after a reboot or its own restart.
RestartSec=30
# Covers the root prestart (native verify, about 12 s; hard cap 150 s) before ExecStart.
TimeoutStartSec=300
# Side-by-side plan D: each release's API gets at most 2G, so two releases side by side fit the host.
MemoryMax=2G
# After every stop, root writes down what it saw (side-by-side spec §4): a DRAINING release whose API
# process is gone gets FRONT_PAIR_STOPPED once; a CURRENT release's crash restart and a STAGED release
# are left as they are. `+` = root without this unit's sandbox; env -i hands node PATH only. The
# recorder's own deadline is 25 s; systemd gives ExecStopPost= the unit's TimeoutStopSec (the live base
# unit's value, which unit-templates.mjs compare keeps unchanged; the systemd default is 90 s).
# A failed record exits 1, the unit is marked failed and OnFailure= emails the owner.
ExecStopPost=+/usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin /opt/debateai-toolchain/node-v26.8.2-linux-x64/bin/node /opt/debateai-v3-preview/operator/lifecycle-v1/dialectical-engine/deploy/preview-lifecycle/v1/release-retire.mjs stopped --service api --label %i
