# FALLBACK ONLY. Not installed by default (README "Team unlock: the readiness writer").
# Install as /etc/systemd/system/debateai-preview-team-unlock.service.d/50-interim-recovery-login.conf
# only while the server lacks migration 0109 or the pg_ident/pg_hba lines for
# debateai_staff_readiness_writer. It makes the team unlock open the old recovery login with a
# temporary password again. Remove it (and daemon-reload) as soon as the peer check passes.
#
# The empty ExecStart= clears the unit's own line; the writer is named on the new line's
# `env -i`, because the process inherits nothing else (an Environment= line has no effect).
# ExecStopPost is unchanged: it resets the recovery login after every run either way.
[Service]
ExecStart=
ExecStart=/usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin PREVIEW_LIFECYCLE_STAFF_WRITER=interim-recovery-login /opt/debateai-toolchain/node-v26.8.2-linux-x64/bin/node /opt/debateai-v3-preview/operator/lifecycle-v1/dialectical-engine/deploy/preview-lifecycle/v1/unlock-team-tools.mjs run
