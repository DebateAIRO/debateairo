# Install as /etc/systemd/system/debateai-preview-api.service.d/zzzzzzzzzz-billing-notice-spool.conf
# (deploy/preview-release/v1/README.md, "H9. The billing notice spool").
# Optional (NETOPIA's answers 2026-10-21, B3a): the folder where the API keeps a NETOPIA message the database could not
# store, sealed, until it is stored. Under ProtectSystem=strict the API writes only the folders its unit names, and with
# BILLING_NOTICE_SPOOL_PATH set it refuses to start when it cannot write this one (BILLING_NOTICE_SPOOL_PATH_INVALID).
# The leading "-" lets the unit start while the folder does not exist. It adds this one path and nothing else.
# Its name sorts after zzzzzzzzz-auth-dev-task12-final.conf (nine z), so no earlier "ReadWritePaths=" reset drops it,
# and before the release drop-in zzzzzzzzzz-lifecycle-release.conf, which sets no ReadWritePaths=.
[Service]
ReadWritePaths=-/var/lib/debateai-v3-preview/api/billing-notice-spool
