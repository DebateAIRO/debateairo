# Install as /etc/systemd/system/debateai-preview-api@.service.d/zzzzzzzzzz-fence-restore.conf
# (deploy/preview-release/v1/README.md, "H11. The restore fence").
# NV-07: the folder of the restore fence file, the API's own: outside the nightly backup and the cold copy, so a restore
# never rolls it back. Under ProtectSystem=strict the API writes only the folders its unit names, and a hosted release
# that carries NV-07 refuses to start without this one (RESTORE_FENCE_DIRECTORY_MISSING). The leading "-" keeps every
# instance of the shared template starting where the folder does not exist yet. It adds this one path and nothing else.
# Its name sorts after zzzzzzzzz-auth-dev-task12-final.conf (nine z) and zzzzzzzzzz-billing-notice-spool.conf, so no
# earlier "ReadWritePaths=" reset drops it, and before the release drop-in zzzzzzzzzz-lifecycle-release.conf, which sets
# no ReadWritePaths=.
[Service]
ReadWritePaths=-/var/lib/debateai-v3-preview/api/restore-fence
