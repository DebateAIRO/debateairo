# deploy/vps/sysctl.d/99-zz-debateai-reserved-ports.conf -> /etc/sysctl.d/ (NV-55)
# The slot ports (website 481/482, API 491/492) are reserved because they are below this value. The name sorts after
# 99-sysctl.conf, so a line there cannot lower it at boot; release.mjs check reads the live value at every release.
net.ipv4.ip_unprivileged_port_start = 1024
