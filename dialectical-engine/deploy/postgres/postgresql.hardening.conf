# deploy/postgres/postgresql.hardening.conf
# Drop into /etc/postgresql/18/main/conf.d/hardening.conf (the Debian/Ubuntu postgresql.conf ends
# with `include_dir = 'conf.d'`, so these override the packaged defaults). PLAN §8 C3; audits
# L5-F7 (TLS material named, TLSv1.3 floor), L5-F11 (no statement or parameter text in logs),
# L7 §C3 (SCRAM in the config file, not only on a command line).

# --- listeners: the Unix socket for every service, loopback TCP for TLS-only tooling ---
listen_addresses = '127.0.0.1, ::1'
port = 5432
unix_socket_directories = '/var/run/postgresql'
max_connections = 200

# --- TLS on loopback TCP (files owned postgres:postgres, key 0600; README §4) ---
ssl = on
ssl_cert_file = '/etc/debateai/postgres-tls/server.crt'
ssl_key_file = '/etc/debateai/postgres-tls/server.key'
ssl_ca_file = '/etc/debateai/postgres-tls/ca.crt'
ssl_min_protocol_version = 'TLSv1.3'
ssl_prefer_server_ciphers = on

# --- authentication ---
password_encryption = scram-sha-256

# --- logging: who connected, never what they said (L5-F11: bind parameters carry passwords,
# e-mail addresses and one-shot tokens). `log_statement` stays 'none' permanently, including
# during `pnpm db:provision-principals`; never raise it on a production cluster. ---
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_file_mode = 0600
log_connections = on
log_disconnections = on
log_hostname = off
log_statement = 'none'
log_min_error_statement = 'panic'
log_min_duration_statement = -1
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_line_prefix = '%m [%p] %q%u@%d '

# --- resource ceilings for wedged sessions (statement_timeout is set per DATABASE in hardening.sql
# so the JIT migrator can override it per session; see README §6) ---
idle_in_transaction_session_timeout = '10min'
tcp_keepalives_idle = 60
