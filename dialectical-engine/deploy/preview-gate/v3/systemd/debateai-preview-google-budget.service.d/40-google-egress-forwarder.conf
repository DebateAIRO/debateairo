# Install as /etc/systemd/system/debateai-preview-google-budget.service.d/40-google-egress-forwarder.conf
# (root:root 0644) ONLY in forwarder mode (README-google.md, "Egress", mode B), together with
# debateai-preview-google-forwarder.socket/.service and the hosts file. Never together with
# 40-google-egress-list.conf or 50-google-addresses.conf. PROPOSED FOR THE OWNER'S REVIEW: not
# yet run on the server.
# The gate gets its own network namespace with only a loopback interface: no route to the
# internet exists at all. In it, 127.0.0.1:443 is the forwarder's listening socket (created by
# systemd inside this namespace), and the gate's private hosts file maps
# generativelanguage.googleapis.com to 127.0.0.1. TLS still runs end to end between the gate and
# Google: the gate checks Google's certificate for that name, so the forwarder sees only
# encrypted bytes and never the key.
[Unit]
Requires=debateai-preview-google-forwarder.socket
After=debateai-preview-google-forwarder.socket
JoinsNamespaceOf=debateai-preview-google-forwarder.socket

[Service]
PrivateNetwork=yes
BindReadOnlyPaths=/opt/debateai-v3-preview/operator/google-budget-v1/gate-hosts:/etc/hosts
# The name must resolve to 127.0.0.1 only, and the forwarder must answer, or the gate does not
# start (GOOGLE_EGRESS_NOT_PROXIED, GOOGLE_PROXY_UNREACHABLE). No byte is sent; no key.
ExecStartPre=/usr/bin/python3 -I /opt/debateai-v3-preview/operator/google-budget-v1/google_addresses.py check-proxy
# Inside the private namespace there is only loopback: reach the forwarder, nothing else.
IPAddressAllow=127.0.0.1/32
