# Install as /etc/systemd/system/debateai-preview-google-budget.service.d/40-google-egress-list.conf
# (root:root 0644) ONLY in measured-list mode (README-google.md, "Egress", mode A), together with
# 50-google-addresses.conf (rendered by google_addresses.py) and the hourly address check.
# Never together with 40-google-egress-forwarder.conf.
[Unit]
Wants=debateai-preview-google-addresses.timer

[Service]
# Every address generativelanguage.googleapis.com has today must be in the allow-list drop-in,
# or the gate does not start (GOOGLE_ADDRESSES_CHANGED). DNS only; no key.
ExecStartPre=/usr/bin/python3 -I /opt/debateai-v3-preview/operator/google-budget-v1/google_addresses.py check --dropin /etc/systemd/system/debateai-preview-google-budget.service.d/50-google-addresses.conf
