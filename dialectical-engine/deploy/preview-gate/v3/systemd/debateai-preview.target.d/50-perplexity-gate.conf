# Install as /etc/systemd/system/debateai-preview.target.d/50-perplexity-gate.conf (root:root 0644),
# only at the "Switch it on" step of README-perplexity.md (before that the gate has no GO and
# would only fail and email). The preview target then starts the Perplexity gate and its two
# watchers at boot, as it does the other gates'. Removing this file (and daemon-reload)
# takes them out of the boot again.
[Unit]
Wants=debateai-preview-perplexity-budget.service
Wants=debateai-preview-perplexity-halt-watch.timer debateai-preview-perplexity-addresses.timer
