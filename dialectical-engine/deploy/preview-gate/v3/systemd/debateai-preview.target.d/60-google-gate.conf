# Install as /etc/systemd/system/debateai-preview.target.d/60-google-gate.conf (root:root 0644),
# once the Google gate is installed (README-google.md). The preview then starts the Google gate
# and its halt watcher with everything else; the egress drop-in starts what its mode needs.
[Unit]
Wants=debateai-preview-google-budget.service debateai-preview-google-halt-watch.timer
