# Install as /etc/systemd/system/debateai-preview.target.d/50-bedrock-gate.conf (root:root 0644),
# only at the "Switch it on" step of README-bedrock.md (before that the gate has no GO and
# would only fail and email). The preview target then starts the Amazon Bedrock gate and its two
# watchers at boot, as it does the other gates'. Removing this file (and daemon-reload)
# takes them out of the boot again.
[Unit]
Wants=debateai-preview-bedrock-budget.service
Wants=debateai-preview-bedrock-halt-watch.timer debateai-preview-bedrock-addresses.timer
