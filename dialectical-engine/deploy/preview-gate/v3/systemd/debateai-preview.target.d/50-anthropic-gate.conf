# Install as /etc/systemd/system/debateai-preview.target.d/50-anthropic-gate.conf (root:root 0644),
# only at the "Switch it on" step of README-anthropic.md (before that the gate has no GO and
# would only fail and email). The preview target then starts the Anthropic gate and its two
# watchers at boot, as it does the DeepInfra gate's. Removing this file (and daemon-reload)
# takes them out of the boot again.
[Unit]
Wants=debateai-preview-anthropic-budget.service
Wants=debateai-preview-anthropic-halt-watch.timer debateai-preview-anthropic-addresses.timer
